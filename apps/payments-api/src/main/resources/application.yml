spring:
  application:
    name: payments-api
  profiles:
    default: local
  datasource:
    url: jdbc:postgresql://${THAAP_POSTGRES_HOST:localhost}:${THAAP_POSTGRES_PORT:5432}/${THAAP_POSTGRES_DB:thaap_payments}
    username: ${THAAP_POSTGRES_USER:thaap}
    password: ${THAAP_POSTGRES_PASSWORD:thaap}
    hikari:
      pool-name: thaap-payments-api
      maximum-pool-size: ${THAAP_DB_POOL_MAX_SIZE:10}
      minimum-idle: ${THAAP_DB_POOL_MIN_IDLE:2}
      connection-timeout: 3000
      validation-timeout: 1000
  data:
    redis:
      repositories:
        enabled: false
      host: ${THAAP_REDIS_HOST:localhost}
      port: ${THAAP_REDIS_PORT:6379}
      timeout: 1s
      connect-timeout: 1s
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  sql:
    init:
      mode: never
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
  kafka:
    bootstrap-servers: ${THAAP_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      fail-fast: false
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      properties:
        enable.idempotence: true
        request.timeout.ms: 10000
        delivery.timeout.ms: 30000
        max.block.ms: 10000
        max.request.size: 69632
    consumer:
      group-id: payment-risk-projection-v1
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      properties:
        max.partition.fetch.bytes: 69632
        fetch.max.bytes: 417792
    listener:
      ack-mode: manual_immediate
      concurrency: 6

springdoc:
  api-docs:
    version: OPENAPI_3_0

server:
  port: ${THAAP_PAYMENTS_API_PORT:8080}
  shutdown: graceful

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
  level:
    # PostgreSQL includes full failing-row values in constraint messages. The
    # API emits a bounded requestId/path/exception-type signal instead.
    org.hibernate.orm.jdbc.error: ERROR

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db,velocityRedis,merchantRiskPolicy,merchantRiskMonitoring,analystWorkspace,riskSimulation,governedControl,disputeOperations,developerScenarios,webhookOperations,eventPublication,paymentRiskProjection,projectionRebuild,offlineReplayDataset,decisionIntelligence
  health:
    db:
      enabled: true
    redis:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: payments-api
    description: THAAP primary payment and fraud simulation API
    version: 0.0.1-SNAPSHOT

thaap:
  admin:
    bootstrap-token: ${THAAP_ADMIN_BOOTSTRAP_TOKEN:}
  platform:
    bootstrap-token: ${THAAP_PLATFORM_BOOTSTRAP_TOKEN:}
  event-publication:
    enabled: ${THAAP_EVENT_PUBLICATION_ENABLED:true}
    topic: thaap.domain-events.v1
    partitions: 6
    retention: 7d
    record-max-bytes: 65536
    poll-batch-size: 100
    tenant-budget: 20
    stream-budget: 10
    lease-duration: 30s
    retry-limit: 10
    retry-base-delay: 1s
    retry-max-delay: 5m
    poll-delay: 1s
    backlog-failure-age: 5m
  projection-consumer:
    enabled: ${THAAP_PROJECTION_CONSUMER_ENABLED:true}
  projection-rebuild:
    worker-enabled: ${THAAP_PROJECTION_REBUILD_WORKER_ENABLED:true}
    chunk-size: 100
    lease-duration: 60s
    poll-delay: ${THAAP_PROJECTION_REBUILD_POLL_DELAY:5s}
  scenario-runner:
    token: ${THAAP_SCENARIO_RUNNER_TOKEN:}
  security:
    hash-pepper: ${THAAP_HASH_PEPPER:}
    hash-pepper-version: ${THAAP_HASH_PEPPER_VERSION:v1}
    previous-hash-peppers: ${THAAP_PREVIOUS_HASH_PEPPERS:}
    correlation-pepper: ${THAAP_CORRELATION_PEPPER:}
  idempotency:
    reservation-lease: ${THAAP_IDEMPOTENCY_RESERVATION_LEASE:30s}
  rate-limit:
    enabled: ${THAAP_RATE_LIMIT_ENABLED:true}
    window: ${THAAP_RATE_LIMIT_WINDOW:1m}
    confirm:
      merchant: ${THAAP_RATE_LIMIT_CONFIRM_MERCHANT:100}
      credential: ${THAAP_RATE_LIMIT_CONFIRM_CREDENTIAL:60}
      client-ip: ${THAAP_RATE_LIMIT_CONFIRM_CLIENT_IP:120}
    payment-method:
      merchant: ${THAAP_RATE_LIMIT_PAYMENT_METHOD_MERCHANT:30}
      credential: ${THAAP_RATE_LIMIT_PAYMENT_METHOD_CREDENTIAL:20}
      client-ip: ${THAAP_RATE_LIMIT_PAYMENT_METHOD_CLIENT_IP:40}
  card-testing-incidents:
    enabled: ${THAAP_CARD_TESTING_INCIDENTS_ENABLED:true}
    detection-window: ${THAAP_CARD_TESTING_DETECTION_WINDOW:10m}
    minimum-attempts: ${THAAP_CARD_TESTING_MINIMUM_ATTEMPTS:5}
    minimum-declines: ${THAAP_CARD_TESTING_MINIMUM_DECLINES:3}
    minimum-distinct-cards: ${THAAP_CARD_TESTING_MINIMUM_DISTINCT_CARDS:3}
  authentication:
    challenge-ttl: ${THAAP_AUTHENTICATION_CHALLENGE_TTL:5m}
    replay-encryption-key: ${THAAP_AUTHENTICATION_REPLAY_ENCRYPTION_KEY:}
    replay-key-version: ${THAAP_AUTHENTICATION_REPLAY_KEY_VERSION:v1}
    replay-decryption-keys: ${THAAP_AUTHENTICATION_REPLAY_DECRYPTION_KEYS:}
  fraud:
    feature-snapshot:
      max-json-bytes: ${THAAP_FEATURE_SNAPSHOT_MAX_JSON_BYTES:16384}
    velocity:
      enabled: ${THAAP_VELOCITY_ENABLED:true}
  webhook:
    execution-enabled: ${THAAP_WEBHOOK_EXECUTION_ENABLED:false}
    secret-encryption-key: ${THAAP_WEBHOOK_SECRET_ENCRYPTION_KEY:}
    secret-key-version: ${THAAP_WEBHOOK_SECRET_KEY_VERSION:v1}
    secret-decryption-keys: ${THAAP_WEBHOOK_SECRET_DECRYPTION_KEYS:}
    secret-rotation-grace: ${THAAP_WEBHOOK_SECRET_ROTATION_GRACE:15m}
    allowed-hosts: ${THAAP_WEBHOOK_ALLOWED_HOSTS:}
    batch-size: ${THAAP_WEBHOOK_BATCH_SIZE:20}
    max-claims-per-merchant-per-poll: ${THAAP_WEBHOOK_MAX_CLAIMS_PER_MERCHANT_PER_POLL:5}
    max-claims-per-endpoint-per-poll: ${THAAP_WEBHOOK_MAX_CLAIMS_PER_ENDPOINT_PER_POLL:2}
    lease-duration: ${THAAP_WEBHOOK_LEASE_DURATION:30s}
    connect-timeout: ${THAAP_WEBHOOK_CONNECT_TIMEOUT:2s}
    request-timeout: ${THAAP_WEBHOOK_REQUEST_TIMEOUT:5s}
    target-resolution-timeout: ${THAAP_WEBHOOK_TARGET_RESOLUTION_TIMEOUT:2s}
    resolver-threads: ${THAAP_WEBHOOK_RESOLVER_THREADS:4}
    verification-challenge-ttl: ${THAAP_WEBHOOK_VERIFICATION_CHALLENGE_TTL:2m}
    verification-expiry-enabled: ${THAAP_WEBHOOK_VERIFICATION_EXPIRY_ENABLED:true}
    verification-expiry-batch-size: ${THAAP_WEBHOOK_VERIFICATION_EXPIRY_BATCH_SIZE:50}
    verification-expiry-poll-delay: ${THAAP_WEBHOOK_VERIFICATION_EXPIRY_POLL_DELAY:30s}
    poll-delay: ${THAAP_WEBHOOK_POLL_DELAY:1s}
  workspace:
    notes:
      encryption-key: ${THAAP_REVIEW_NOTE_ENCRYPTION_KEY:}
      key-version: ${THAAP_REVIEW_NOTE_KEY_VERSION:v1}
      decryption-keys: ${THAAP_REVIEW_NOTE_DECRYPTION_KEYS:}
      retention-poll-delay: ${THAAP_REVIEW_NOTE_RETENTION_POLL_DELAY:1h}
  simulation:
    worker-enabled: ${THAAP_SIMULATION_WORKER_ENABLED:true}
    creation-enabled: ${THAAP_SIMULATION_CREATION_ENABLED:true}
    chunk-size: ${THAAP_SIMULATION_CHUNK_SIZE:100}
    maximum-cohort-days: ${THAAP_SIMULATION_MAXIMUM_COHORT_DAYS:365}
    report-freshness: ${THAAP_SIMULATION_REPORT_FRESHNESS:24h}
    gate:
      minimum-eligible-population: ${THAAP_SIMULATION_GATE_MINIMUM_ELIGIBLE_POPULATION:100}
      minimum-label-coverage-percent: ${THAAP_SIMULATION_GATE_MINIMUM_LABEL_COVERAGE_PERCENT:50}
  replay-datasets:
    worker-enabled: ${THAAP_REPLAY_DATASET_WORKER_ENABLED:true}
    creation-enabled: ${THAAP_REPLAY_DATASET_CREATION_ENABLED:true}
    chunk-size: ${THAAP_REPLAY_DATASET_CHUNK_SIZE:100}
    maximum-cohort-days: ${THAAP_REPLAY_DATASET_MAXIMUM_COHORT_DAYS:365}
    maximum-population: ${THAAP_REPLAY_DATASET_MAXIMUM_POPULATION:1000000}
    lease-duration: ${THAAP_REPLAY_DATASET_LEASE_DURATION:60s}
    retry-limit: ${THAAP_REPLAY_DATASET_RETRY_LIMIT:10}
    recovery-batch-size: ${THAAP_REPLAY_DATASET_RECOVERY_BATCH_SIZE:10}
    recovery-poll-delay: ${THAAP_REPLAY_DATASET_RECOVERY_POLL_DELAY:5s}
    stale-age: ${THAAP_REPLAY_DATASET_STALE_AGE:5m}
  disputes:
    expiry-enabled: ${THAAP_DISPUTE_EXPIRY_ENABLED:true}
    expiry-batch-size: ${THAAP_DISPUTE_EXPIRY_BATCH_SIZE:50}
    expiry-poll-delay: ${THAAP_DISPUTE_EXPIRY_POLL_DELAY:1m}
  developer-scenarios:
    creation-enabled: ${THAAP_DEVELOPER_SCENARIO_CREATION_ENABLED:true}
    lease-duration: ${THAAP_DEVELOPER_SCENARIO_LEASE_DURATION:45s}
