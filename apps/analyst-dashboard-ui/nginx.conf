# Analyst workspace static serving and API routing.
#
# The seven `location` prefixes below are not a free-hand list. They must equal the keys of
# `paymentsApiProxy` in vite.config.ts exactly, and `src/routingContract.test.ts` fails the build
# when they diverge. A prefix added to the dev proxy and forgotten here is a feature that works
# on a laptop and 404s in production, which is the single most predictable way to ship a broken
# deployment from a green test suite.
#
# The same list drives the CloudFront cache behaviors in infra/terraform. Three places, one
# source of truth, one test holding them together.

server {
    listen 8081;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API is reachable under a compose service name locally and an ALB origin in AWS. It is
    # resolved per-request rather than at startup so the container does not die permanently when
    # the API happens to boot second.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /risk                { proxy_pass http://payments-api:8080; }
    location /developer           { proxy_pass http://payments-api:8080; }
    location /customers           { proxy_pass http://payments-api:8080; }
    location /payment_methods     { proxy_pass http://payments-api:8080; }
    location /payment_intents     { proxy_pass http://payments-api:8080; }
    location /webhook_endpoints   { proxy_pass http://payments-api:8080; }
    location /webhook_deliveries  { proxy_pass http://payments-api:8080; }

    # Credential headers are forwarded untouched. The API derives tenancy from them; nginx must
    # not interpret, default, or rewrite them.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # The workspace is a routed SPA. Any non-API path is served by the application shell so a
    # deep link into an investigation survives a page reload.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Hashed assets are immutable; index.html must never be, or a deploy leaves browsers pinned
    # to a stale shell that references assets which no longer exist.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server_tokens off;
}
