spring:
  datasource:
    url: jdbc:h2:mem:thaap_payments;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  data:
    redis:
      repositories:
        enabled: false
      host: localhost
      port: 6379
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

management:
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: false

thaap:
  admin:
    bootstrap-token: test-admin-bootstrap-token
  scenario-runner:
    token: test-scenario-runner-token
  security:
    hash-pepper: test-hash-pepper-for-sensitive-value-contracts
    hash-pepper-version: test-v1
    previous-hash-peppers:
    correlation-pepper: test-hash-pepper-for-sensitive-value-contracts
  idempotency:
    reservation-lease: 30s
  rate-limit:
    enabled: false
  card-testing-incidents:
    enabled: false
  authentication:
    challenge-ttl: 5m
    replay-encryption-key: dGVzdC1hdXRoLXJlcGxheS1rZXktMzItYnl0ZXMtMTI=
    replay-key-version: test-v1
    replay-decryption-keys:
  fraud:
    feature-snapshot:
      max-json-bytes: 16384
    velocity:
      enabled: false
  webhook:
    execution-enabled: false
    secret-encryption-key: dGVzdC13ZWJob29rLWtleS0zMi1ieXRlcy0xMjM0NTY=
    secret-key-version: test-v1
    secret-rotation-grace: 15m
    secret-decryption-keys:
    allowed-hosts:
    batch-size: 20
    lease-duration: 30s
    connect-timeout: 2s
    request-timeout: 5s
    target-resolution-timeout: 2s
    resolver-threads: 2
    verification-challenge-ttl: 2m
    verification-expiry-enabled: false
    verification-expiry-batch-size: 50
    verification-expiry-poll-delay: 24h
    # Contract tests invoke scheduler behavior directly. A long test-only delay
    # prevents cached Spring contexts from polling a Testcontainers database
    # after that class-owned container has shut down.
    poll-delay: 24h
  workspace:
    notes:
      encryption-key: dGVzdC1yZXZpZXctbm90ZS1rZXktMzItYnl0ZXMtMTI=
      key-version: test-v1
      decryption-keys:
      retention-poll-delay: 24h
  simulation:
    worker-enabled: false
    creation-enabled: false
    chunk-size: 2
    maximum-cohort-days: 365
    report-freshness: 24h
  disputes:
    expiry-enabled: false
    expiry-batch-size: 10
    expiry-poll-delay: 24h
