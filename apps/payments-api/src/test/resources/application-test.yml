spring:
  datasource:
    url: jdbc:h2:mem:thaap_payments;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  data:
    redis:
      repositories:
        enabled: false
      host: localhost
      port: 6379
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: false

thaap:
  admin:
    bootstrap-token: test-admin-bootstrap-token
  security:
    hash-pepper: test-hash-pepper-for-sensitive-value-contracts
