name: Commit readiness

# The authoritative gate. Every repository check already lives in
# scripts/commit-readiness-check.sh; until now nothing ran it except a human choosing to, and
# nothing read its exit code. That is how a merged commit came to claim the gate passed when it
# had been exiting 1 for a missing tool. CI removes the choice.
#
# This workflow deliberately calls the same script a developer runs rather than re-listing its
# gates here. A duplicated list drifts, and the copy that drifts is always the one nobody reads.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      randomOrderSeed:
        description: >-
          Replay one randomized ordering in the "Randomized test order" job. Take the seed from a
          failed run's summary. Leave blank for a fresh shuffle. Seeds replay on a runner of the
          same platform, not on a developer machine -- see that job's comment.
        required: false
        type: string

# A superseded run proves nothing about the tip, so let a newer push cancel it — except on the
# default branches, where every commit's result is part of the record.
concurrency:
  group: commit-readiness-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/master' }}

jobs:
  release-journeys:
    name: Default-runtime release journeys
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prove fresh migration, routed API and current-default analyst/risk journeys
        env:
          THAAP_STACK_CHECK_JOURNEYS: "true"
        run: bash scripts/compose-stack-check.sh
      - name: Prove broker container replacement preserves records and offsets
        run: bash scripts/broker-persistence-check.sh
      - name: Prove real nginx strips forged forwarding metadata
        run: bash scripts/proxy-header-check.sh

  commit-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confirm Docker is available for Testcontainers
        # The PostgreSQL suites are annotated disabledWithoutDocker, so a runner without Docker
        # would skip every concurrency, migration and restart proof and still report success.
        # A silent skip of the adversarial half is the exact condition this repository's proof
        # audit exists to prevent, so the absence of Docker fails the run instead.
        run: |
          docker version
          docker info >/dev/null

      - name: Resolve the learning day under review
        # The readiness gate validates the daily learning note for a given date. Using the
        # runner's clock would fail every push made on a day that has no note yet, for reasons
        # unrelated to the change. The newest note in the branch is the one this work belongs to.
        id: learning-day
        run: |
          day="$(ls docs/learning/daily \
            | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}\.md$' \
            | sort \
            | tail -1 \
            | sed 's/\.md$//')"
          if [[ -z "$day" ]]; then
            echo "No daily learning note found under docs/learning/daily" >&2
            exit 1
          fi
          echo "day=$day" >> "$GITHUB_OUTPUT"
          echo "Reviewing learning day $day"

      - name: Run the commit readiness gate with tests
        run: bash scripts/commit-readiness-check.sh "${{ steps.learning-day.outputs.day }}" --run-tests

      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: apps/payments-api/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

  terraform:
    # The readiness gate checks that every region derives from a variable and that the routing
    # contract agrees across all four routers. Neither of those asks whether the configuration is
    # syntactically valid or matches the provider schema, and a topology that does not parse is
    # not a topology. `validate` needs no credentials, so it belongs here rather than waiting for
    # an account to exist -- which is the whole reason Chapter 63 can be written before the
    # account does.
    #
    # Mocked plan tests exercise evaluation and configured boundaries without an account.
    # They cannot certify a real AWS plan, deployment, exposure or alarm notification.
    name: Terraform validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          # Pinned to the same version scripts/terraform.sh runs in its container, so a developer
          # and CI cannot disagree about whether the configuration is valid.
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Check formatting
        run: terraform -chdir=infra/terraform fmt -check -recursive -diff

      - name: Validate the topology
        run: |
          terraform -chdir=infra/terraform init -backend=false -input=false
          terraform -chdir=infra/terraform validate
          terraform -chdir=infra/terraform test -no-color

      - name: Prove edge request routing and forwarding-header partitions
        run: node --test scripts/edge-request.test.mjs

      - name: Validate the state backend bootstrap
        run: |
          terraform -chdir=infra/terraform/bootstrap init -backend=false -input=false
          terraform -chdir=infra/terraform/bootstrap validate

  randomized-order:
    # The suite now runs in a pinned alphabetical order everywhere, which is what makes a local
    # run and a CI run comparable. It also freezes one ordering forever, and a suite only ever
    # exercised in one order stops being able to find the bug that ordering hides -- which is
    # precisely the bug it just found: a test that deleted meters from a MeterRegistry shared with
    # thirty other classes, invisible unless it ran first.
    #
    # So the shuffle is kept, deliberately and in one place. A failure here means a real order
    # dependency exists and is never flake.
    #
    # On replaying a failure, precisely, because the obvious reading is wrong: surefire shuffles the
    # class list the directory scanner produced, and that input order is itself filesystem order. The
    # same seed therefore yields one permutation on ext4 and a different one on APFS -- replaying
    # this job's seed on a Mac was measured to produce a completely different ordering. A seed
    # replays on a runner of the same platform, not on a developer machine. That is what the
    # workflow_dispatch input above is for: re-run this workflow with the seed from a failed run's
    # summary to get that exact ordering back.
    name: Randomized test order
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Confirm Docker is available for Testcontainers
        run: |
          docker version
          docker info >/dev/null

      - name: Run the backend suite in a random order
        env:
          REPLAY_SEED: ${{ inputs.randomOrderSeed }}
        run: |
          set -o pipefail
          seed_flag=""
          if [[ -n "$REPLAY_SEED" ]]; then
            seed_flag="-Dsurefire.runOrder.random.seed=$REPLAY_SEED"
            echo "Replaying the ordering from seed $REPLAY_SEED"
          fi
          mvn -B -f apps/payments-api/pom.xml -Dsurefire.runOrder=random $seed_flag test \
            | tee randomized-order.log

      - name: Publish the seed that replays this ordering
        if: always()
        run: |
          seed="$(grep -oE 'surefire\.runOrder\.random\.seed=[0-9]+' randomized-order.log \
            | tail -1 | cut -d= -f2 || true)"
          if [[ -z "$seed" ]]; then
            echo "No surefire random seed found in the build log." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Randomized test order"
            echo
            echo "Replay this exact ordering with:"
            echo
            echo '```bash'
            echo "mvn -f apps/payments-api/pom.xml test -Dsurefire.runOrder=random \\"
            echo "  -Dsurefire.runOrder.random.seed=$seed"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-randomized
          path: apps/payments-api/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14
