spring:
  datasource:
    url: jdbc:h2:mem:thaap_payments;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: false
