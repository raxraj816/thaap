name: thaap-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: thaap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${THAAP_POSTGRES_DB:-thaap_payments}
      POSTGRES_USER: ${THAAP_POSTGRES_USER:-thaap}
      POSTGRES_PASSWORD: ${THAAP_POSTGRES_PASSWORD:-thaap}
    ports:
      - "${THAAP_POSTGRES_PORT:-5432}:5432"
    volumes:
      - thaap-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    container_name: thaap-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${THAAP_REDIS_PORT:-6379}:6379"
    volumes:
      - thaap-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  kafka:
    image: apache/kafka:3.9.1
    container_name: thaap-kafka
    restart: unless-stopped
    ports:
      - "${THAAP_KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${THAAP_KAFKA_PORT:-9092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - thaap-kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  thaap-postgres-data:
  thaap-redis-data:
  thaap-kafka-data:
