[project]
name = "thaap-risk-sdk"
version = "0.1.0"
description = "THAAP local-sandbox payment risk client. Not published to any package index."
authors = [{name = "THAAP"}]
readme = "README.md"
keywords = ["OpenAPI", "OpenAPI-Generator", "THAAP Public Payment Risk API"]
# A finite, tested runtime set. An open-ended ">=3.11" would advertise support for
# Python versions that have never run this suite, and the first integrator on a new
# release would discover the transport behaviour changed underneath them.
requires-python = ">=3.11,<3.15"
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

# Bounded on both sides. An unpinned upper bound lets a major release of the
# transport change redirect, proxy or timeout behaviour that this SDK's security
# promises depend on, without any change to THAAP.
dependencies = [
  "urllib3 (>=2.1.0,<3.0.0)",
  "python-dateutil (>=2.8.2,<3.0.0)",
  "pydantic (>=2.11,<3.0.0)",
  "typing-extensions (>=4.7.1,<5.0.0)",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pylint.'MESSAGES CONTROL']
extension-pkg-whitelist = "pydantic"

[tool.mypy]
files = [
  "thaap_sdk",
  "tests",
]
# TODO: enable "strict" once all these individual checks are passing
# strict = true

# List from: https://mypy.readthedocs.io/en/stable/existing_code.html#introduce-stricter-options
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

## Getting these passing should be easy
strict_equality = true
extra_checks = true

## Strongly recommend enabling this one as soon as you can
check_untyped_defs = true

## These shouldn't be too much additional work, but may be tricky to
## get passing if you use a lot of untyped libraries
disallow_subclassing_any = true
disallow_untyped_decorators = true
disallow_any_generics = true

### These next few are various gradations of forcing use of type annotations
#disallow_untyped_calls = true
#disallow_incomplete_defs = true
#disallow_untyped_defs = true
#
### This one isn't too hard to get passing, but return on investment is lower
#no_implicit_reexport = true
#
### This one can be tricky to get passing if you use a lot of untyped libraries
#warn_return_any = true

[[tool.mypy.overrides]]
module = [
  "thaap_sdk.generated.configuration",
]
warn_unused_ignores = true
strict_equality = true
extra_checks = true
check_untyped_defs = true
disallow_subclassing_any = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_reexport = true
warn_return_any = true
