spring:
  datasource:
    url: jdbc:h2:mem:thaap_payments;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  data:
    redis:
      repositories:
        enabled: false
      host: localhost
      port: 6379
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: false

thaap:
  admin:
    bootstrap-token: test-admin-bootstrap-token
  security:
    hash-pepper: test-hash-pepper-for-sensitive-value-contracts
  fraud:
    feature-snapshot:
      max-json-bytes: 16384
  webhook:
    execution-enabled: false
    secret-encryption-key: dGVzdC13ZWJob29rLWtleS0zMi1ieXRlcy0xMjM0NTY=
    secret-key-version: test-v1
    secret-decryption-keys:
    allowed-hosts:
    batch-size: 20
    lease-duration: 30s
    connect-timeout: 2s
    request-timeout: 5s
    target-resolution-timeout: 2s
    resolver-threads: 2
    poll-delay: 1s
