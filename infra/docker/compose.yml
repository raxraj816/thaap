name: thaap-local

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${THAAP_POSTGRES_DB:-thaap_payments}
      POSTGRES_USER: ${THAAP_POSTGRES_USER:-thaap}
      POSTGRES_PASSWORD: ${THAAP_POSTGRES_PASSWORD:-thaap}
    ports:
      - "${THAAP_POSTGRES_PORT:-5432}:5432"
    volumes:
      - thaap-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${THAAP_REDIS_PORT:-6379}:6379"
    volumes:
      - thaap-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  kafka:
    image: apache/kafka:3.9.1@sha256:4ceccc577f03f51f6af8dbfda55194d0d892f4fa7913ffbded567ce3895622ed
    mem_limit: 1024m
    restart: unless-stopped
    ports:
      # The host reaches Kafka on its usual port; the container network does not use this mapping
      # at all. See the dual-listener note below.
      - "${THAAP_KAFKA_PORT:-9092}:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
      KAFKA_PROCESS_ROLES: broker,controller
      # Two client listeners, because a Kafka client does not talk to the address it was given —
      # it asks for metadata and then connects to whatever the broker advertises. A single
      # `localhost` advertisement works from the host and is unreachable from every container,
      # which fails only once the API is containerised rather than run from an IDE.
      #
      #   PLAINTEXT       kafka:9092       reachable inside the compose network
      #   PLAINTEXT_HOST  localhost:9092   reachable from the developer's machine, port unchanged
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${THAAP_KAFKA_PORT:-9092}
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - thaap-kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  payments-api:
    build:
      context: ../../apps/payments-api
      dockerfile: Dockerfile
      # Compose cannot run `git rev-parse`, and a stranger following the quickstart may not have
      # git at all, so these default to `unknown` — which is what a locally built image honestly
      # is. scripts/release-identity-check.sh supplies the real values and proves the instance
      # reports them; nothing that reaches a registry is built this way.
      args:
        THAAP_BUILD_COMMIT: ${THAAP_BUILD_COMMIT:-unknown}
        THAAP_BUILD_VERSION: ${THAAP_BUILD_VERSION:-unknown}
    image: thaap/payments-api:local
    restart: unless-stopped
    ports:
      - "${THAAP_PAYMENTS_API_PORT:-8080}:8080"
    environment:
      THAAP_POSTGRES_HOST: postgres
      THAAP_POSTGRES_PORT: 5432
      THAAP_POSTGRES_DB: ${THAAP_POSTGRES_DB:-thaap_payments}
      THAAP_POSTGRES_USER: ${THAAP_POSTGRES_USER:-thaap}
      THAAP_POSTGRES_PASSWORD: ${THAAP_POSTGRES_PASSWORD:-thaap}
      THAAP_REDIS_HOST: redis
      THAAP_REDIS_PORT: 6379
      # The in-network advertisement, not the host one. See the Kafka listener note above.
      THAAP_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      # Local development values only.
      #
      # These are committed deliberately: a stack that cannot start without a secrets ceremony is
      # a stack nobody runs, and the alternative is every developer inventing their own keys and
      # discovering the format by stack trace. They are safe to publish because they protect
      # nothing — this profile talks to a throwaway database on a laptop.
      #
      # Under the `aws` profile the application refuses to start when a secret is absent, so
      # these defaults cannot silently become production keys by being left unset somewhere that
      # matters.
      THAAP_ADMIN_BOOTSTRAP_TOKEN: ${THAAP_ADMIN_BOOTSTRAP_TOKEN:-local-admin-bootstrap-token}
      THAAP_PLATFORM_BOOTSTRAP_TOKEN: ${THAAP_PLATFORM_BOOTSTRAP_TOKEN:-local-platform-bootstrap-token}
      THAAP_SCENARIO_RUNNER_TOKEN: ${THAAP_SCENARIO_RUNNER_TOKEN:-local-scenario-runner-token}
      THAAP_HASH_PEPPER: ${THAAP_HASH_PEPPER:-local-hash-pepper-not-for-production}
      THAAP_CORRELATION_PEPPER: ${THAAP_CORRELATION_PEPPER:-local-correlation-pepper-not-for-production}
      THAAP_WEBHOOK_SECRET_ENCRYPTION_KEY: ${THAAP_WEBHOOK_SECRET_ENCRYPTION_KEY:-AXqcQyEyp+PaWc4kNkglchMezuXhDCBnqoQT/BRKEo0=}
      THAAP_REVIEW_NOTE_ENCRYPTION_KEY: ${THAAP_REVIEW_NOTE_ENCRYPTION_KEY:-qLPaIJTvXW+fHN7xUJTuVzw+BQuCa3zXBsFonNM56Z0=}
      THAAP_AUTHENTICATION_REPLAY_ENCRYPTION_KEY: ${THAAP_AUTHENTICATION_REPLAY_ENCRYPTION_KEY:-s083f4o4N0LsdH3WLDjeJa/S4Ow+StpqsYeoMs0eCb0=}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  analyst-dashboard-ui:
    build:
      context: ../../apps/analyst-dashboard-ui
      dockerfile: Dockerfile
      args:
        THAAP_BUILD_COMMIT: ${THAAP_BUILD_COMMIT:-unknown}
        THAAP_BUILD_VERSION: ${THAAP_BUILD_VERSION:-unknown}
    image: thaap/analyst-dashboard-ui:local
    restart: unless-stopped
    ports:
      - "${THAAP_ANALYST_UI_PORT:-8081}:8081"
    depends_on:
      # Started after the API, but not gated on its readiness: nginx resolves the upstream per
      # request, so the workspace can serve its shell and report an unavailable API rather than
      # refusing to start at all.
      - payments-api

volumes:
  thaap-postgres-data:
  thaap-redis-data:
  thaap-kafka-data:
